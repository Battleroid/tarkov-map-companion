name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }

          # The assembly version has to be bare numbers, so strip the leading v and any
          # pre-release suffix. Fail loudly rather than shipping a binary that lies about
          # which build it is.
          $numeric = ($v -replace '^v', '') -replace '[-+].*$', ''
          if ($numeric -notmatch '^\d+(\.\d+){0,3}$') {
            throw "tag '$v' does not contain a version number I can build with"
          }

          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric=$numeric" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "building $v as assembly version $numeric"

      # Never ship a build whose tests did not pass.
      - name: Test
        run: dotnet test TarkovMapCompanion.sln -c Release

      # The version has to be stamped in here, from the tag. Without it the binary carries
      # whatever is checked into the csproj, and every release since the first reported itself
      # as 0.1.0 -- in the About window and, more painfully, in the crash log, which is exactly
      # where you need to know which build someone is running.
      - name: Publish single-file win-x64
        run: >
          dotnet publish src/TarkovMapCompanion/TarkovMapCompanion.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.numeric }}
          -p:InformationalVersion=${{ steps.ver.outputs.version }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -p:DebugSymbols=false
          -o publish

      - name: Name the release asset
        shell: pwsh
        run: |
          Remove-Item publish\*.pdb -ErrorAction SilentlyContinue
          $name = "TarkovMapCompanion-${{ steps.ver.outputs.version }}-win-x64.exe"
          Move-Item publish\TarkovMapCompanion.exe $name
          "$name is $([math]::Round((Get-Item $name).Length / 1MB, 1)) MB"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Tarkov Map Companion ${{ steps.ver.outputs.version }}
          files: TarkovMapCompanion-*-win-x64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Download **TarkovMapCompanion-${{ steps.ver.outputs.version }}-win-x64.exe** below and run it.
            Nothing to install: .NET is bundled, and the maps and exit data are baked in, so it works offline.

            Windows SmartScreen will warn about an unsigned executable the first time.
            Choose *More info* then *Run anyway*, or check the Actions build log to see it was built from this tag.
